name: Deploy Preview

on: [pull_request]

env:
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
  NEON_DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME }}
  NEON_DATABASE_USERNAME: ${{ secrets.NEON_DATABASE_USERNAME }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

jobs:
  deploy-preview:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v8

      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v5
        with:
          api_key: ${{ env.NEON_API_KEY }}
          project_id: ${{ env.NEON_PROJECT_ID }}
          database: ${{ env.NEON_DATABASE_NAME }}
          username: ${{ env.NEON_DATABASE_USERNAME }}
          branch_name: preview/pr-${{ github.event.number }}-${{ steps.branch-name.outputs.current_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run generate-migrate
        env:
          DIRECT_URL: ${{ steps.create-branch.outputs.db_url }}
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url_with_pooler }}

      - name: Install Netlify CLI
        run: npm install -g netlify-cli && netlify link --id ${{ env.NETLIFY_SITE_ID }} --auth ${{ env.NETLIFY_AUTH_TOKEN }}

      # Local .env is not enough: Next.js SSR reads process.env on Netlify's servers.
      # Use a branch-specific Netlify context per PR to avoid cross-PR env collisions.
      - name: Deploy preview to Netlify with CLI
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          NETLIFY_CONTEXT="branch:${{ steps.branch-name.outputs.current_branch }}"
          DEPLOY_ALIAS="pr-${{ github.event.number }}"

          # Recreate branch-scoped vars so scope includes runtime/functions.
          netlify env:unset DATABASE_URL --context "$NETLIFY_CONTEXT" --force || true
          netlify env:unset DIRECT_URL --context "$NETLIFY_CONTEXT" --force || true

          netlify env:set DATABASE_URL "${{ steps.create-branch.outputs.db_url_with_pooler }}" \
            --context "$NETLIFY_CONTEXT" \
            --secret \
            --force
          netlify env:set DIRECT_URL "${{ steps.create-branch.outputs.db_url }}" \
            --context "$NETLIFY_CONTEXT" \
            --secret \
            --force

          netlify deploy --alias="$DEPLOY_ALIAS" --context="$NETLIFY_CONTEXT" --json > netlify-deploy.json
          DEPLOY_URL=$(cat netlify-deploy.json | jq -r ".deploy_url")
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Comment on pull request
        uses: thollander/actions-comment-pull-request@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            | Resource | Link |
            |----------|------|
            | Netlify Preview | ${{ steps.deploy.outputs.deploy_url }} |
            | Neon branch | https://console.neon.tech/app/projects/${{ env.NEON_PROJECT_ID }}/branches/${{ steps.create-branch.outputs.branch_id }} |
